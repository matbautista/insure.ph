name: Promote to Production

# Manual-only, deliberate promotion of a specific commit that has already
# been deployed to staging. This is the staging -> production protocol:
# nothing is ever auto-deployed to production by a push.
#
# One-time setup this workflow depends on (cannot be done from YAML):
#   Settings -> Environments -> production -> Required reviewers
#   Add whoever must approve a production release. Once set, this job
#   pauses for their approval before the "promote" job runs.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA already verified in staging (see the staging deploy's run, or `git log main`)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Refuse to promote a commit that was never on main
        run: |
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} is not an ancestor of main - refusing to promote a commit staging never actually ran."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build for production
        run: npm run build:production
        # env:
        #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
        #   AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Deploy
        run: |
          echo "TODO: no hosting provider has been chosen yet (see ENVIRONMENTS.md)."
          echo "Replace this step with the provider's deploy action/CLI."
          echo "Promoting commit ${{ inputs.sha }} to production."

      - name: Tag the release for audit trail
        env:
          SHA: ${{ inputs.sha }}
        run: |
          tag="production/$(date -u +%Y%m%dT%H%M%SZ)-${SHA::8}"
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
