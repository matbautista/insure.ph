name: Promote to Production

# Manual-only, deliberate promotion of a specific commit that has already
# been deployed to staging. This is the staging -> production protocol:
# nothing is ever auto-deployed to production by a push.
#
# One-time setup this workflow depends on (cannot be done from YAML):
#   Settings -> Environments -> production -> Required reviewers
#   Add whoever must approve a production release. Once set, this job
#   pauses for their approval before the "promote" job runs.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA already verified in staging (see the staging deploy's run, or `git log main`)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Refuse to promote a commit that was never on main
        run: |
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} is not an ancestor of main - refusing to promote a commit staging never actually ran."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build and deploy to Netlify (production)
        # See cd.yml for why this is `--build` (runs netlify.toml's build
        # command + the Next.js plugin transform) and why no DATABASE_URL /
        # RESEND_API_KEY / AUTH_SECRET is passed here: those are runtime
        # secrets for Netlify Functions, configured on the production site
        # itself, not GitHub Actions secrets.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          APP_ENV: production
        run: npx netlify-cli@27 deploy --build --prod

      - name: Promoting commit
        run: echo "Promoted commit ${{ inputs.sha }} to production."

      - name: Tag the release for audit trail
        env:
          SHA: ${{ inputs.sha }}
        run: |
          tag="production/$(date -u +%Y%m%dT%H%M%SZ)-${SHA::8}"
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
