name: Promote to Production

# Manual-only, deliberate promotion of a specific commit. demo, development,
# and staging are local-only (see ENVIRONMENTS.md) - there is no hosted
# staging deployment to check, so verification before promoting is a manual
# local step (npm run build:staging / dev:staging), not a CI gate. Nothing
# is ever auto-deployed to production by a push.
#
# One-time setup this workflow depends on (cannot be done from YAML):
#   Settings -> Environments -> production -> Required reviewers
#   Add whoever must approve a production release. Once set, this job
#   pauses for their approval before the "promote" job runs.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA verified locally (staging build/run), or `git log main`"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Refuse to promote a commit that was never on main
        run: |
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} is not an ancestor of main - refusing to promote a commit staging never actually ran."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build and deploy to Vercel (production)
        # No DATABASE_URL / RESEND_API_KEY / AUTH_SECRET here: those are
        # runtime secrets for Vercel Functions, configured on the production
        # Vercel project itself, not GitHub Actions secrets. vercel.json's
        # buildCommand is hardcoded to `npm run build:production` (the only
        # environment that ever deploys), so no APP_ENV plumbing is needed.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@58 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@58 build --prod --token="$VERCEL_TOKEN"
          npx vercel@58 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Promoting commit
        run: echo "Promoted commit ${{ inputs.sha }} to production."

      - name: Tag the release for audit trail
        env:
          SHA: ${{ inputs.sha }}
        run: |
          tag="production/$(date -u +%Y%m%dT%H%M%SZ)-${SHA::8}"
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
