name: CD (demo / development / staging)

# Branch -> environment mapping for the three environments that deploy
# automatically. Production is deliberately NOT here — see
# promote-production.yml and ENVIRONMENTS.md.
on:
  push:
    branches:
      - develop # -> development
      - demo # -> demo
      - main # -> staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to (re-)deploy on demand, e.g. to reset demo"
        required: true
        type: choice
        options: [demo, development, staging]

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=development" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "demo" ]; then
            echo "environment=demo" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "No environment mapped for ref ${{ github.ref_name }}" >&2
            exit 1
          fi

  deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest
    # Maps to a GitHub "Environment" (Settings -> Environments) so secrets are
    # scoped per environment.
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      APP_ENV: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build and deploy to Vercel (${{ env.APP_ENV }})
        # `vercel pull` fetches this project's settings and Environment
        # Variables (DATABASE_URL / RESEND_API_KEY / AUTH_SECRET / APP_ENV —
        # configured on the Vercel project itself, NOT GitHub secrets, since
        # they're runtime values for Vercel Functions, scoped per project
        # same as everywhere else in this repo is scoped per environment).
        # `--environment=production` / `--prod` refer to *this Vercel
        # project's* primary environment, not this repo's app-environment
        # concept — each app environment is its own Vercel project, so
        # there's no separate "prod" to distinguish here. vercel.json's
        # buildCommand (`npm run build:$APP_ENV`) does the actual env
        # selection, using the pulled APP_ENV variable. See ENVIRONMENTS.md.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@58 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@58 build --prod --token="$VERCEL_TOKEN"
          npx vercel@58 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: How to promote this to production
        if: env.APP_ENV == 'staging'
        run: |
          echo "If this staging deploy checks out, promote it with:"
          echo "  gh workflow run promote-production.yml -f sha=${{ github.sha }}"
          echo "(requires the commit to be on main, and approval from a required reviewer on the production environment)"
