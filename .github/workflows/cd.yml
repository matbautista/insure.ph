name: CD (demo / development / staging)

# Branch -> environment mapping for the three environments that deploy
# automatically. Production is deliberately NOT here — see
# promote-production.yml and ENVIRONMENTS.md.
on:
  push:
    branches:
      - develop # -> development
      - demo # -> demo
      - main # -> staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to (re-)deploy on demand, e.g. to reset demo"
        required: true
        type: choice
        options: [demo, development, staging]

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=development" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "demo" ]; then
            echo "environment=demo" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "No environment mapped for ref ${{ github.ref_name }}" >&2
            exit 1
          fi

  deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest
    # Maps to a GitHub "Environment" (Settings -> Environments) so secrets are
    # scoped per environment.
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      APP_ENV: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build and deploy to Netlify (${{ env.APP_ENV }})
        # `netlify deploy --build` runs netlify.toml's build command
        # (`npm run build:$APP_ENV`, hence APP_ENV in `env:` below) and the
        # @netlify/plugin-nextjs transform, then deploys the result as this
        # site's live (production-context) deploy — each app environment is
        # its own Netlify site, so there's no separate "prod" to distinguish
        # here. DATABASE_URL / RESEND_API_KEY / AUTH_SECRET are NOT passed
        # from GitHub: they're runtime secrets for Netlify Functions, so they
        # live in this site's own environment variables (Netlify UI/API),
        # scoped per site same as everywhere else in this repo is scoped per
        # environment. See ENVIRONMENTS.md.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli@27 deploy --build --prod

      - name: How to promote this to production
        if: env.APP_ENV == 'staging'
        run: |
          echo "If this staging deploy checks out, promote it with:"
          echo "  gh workflow run promote-production.yml -f sha=${{ github.sha }}"
          echo "(requires the commit to be on main, and approval from a required reviewer on the production environment)"
