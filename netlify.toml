# Deploys are driven entirely by GitHub Actions (see .github/workflows/cd.yml
# and promote-production.yml) via `netlify deploy --build`, not by Netlify's
# own git integration. Each environment (demo/development/staging/production)
# is its own Netlify site, created without a linked git repo, so nothing here
# races against the GH Actions deploy. APP_ENV is set as an environment
# variable on each site (Site configuration -> Environment variables) to pick
# the right `npm run build:<environment>` script — see ENVIRONMENTS.md.

[build]
  command = "npm run build:$APP_ENV"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
